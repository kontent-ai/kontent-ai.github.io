name: spellchecking

on: [pull_request]

jobs:
  spellchecking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        name: Check out the code
      - uses: actions/setup-node@v7
        name: Run spell check
        with:
          node-version: "lts/*"
      - run: npm install -g cspell
      - run: cspell --config ./cSpell.json "**/*.md"